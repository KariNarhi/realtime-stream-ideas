<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
    <title>Game suggestions for streaming</title>
  </head>
  <body class="app-body">
    <nav class="navbar app-nav">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Game suggestions for streaming</span>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="row">
        <div class="col-md-6">
          <h1 class="app-title text-center mb-3">
            Suggest a game
          </h1>
          <form id="form">
            <div class="form-group">
              <input
                type="text"
                id="idea-text"
                class="form-control app-input"
                placeholder="Game name"
                maxlength="30"
                required
              />
            </div>
            <div class="form-group">
              <input
                type="text"
                id="idea-tech"
                class="form-control app-input"
                placeholder="Modifications, goofy ideas, etc..."
                maxlength="30"
                required
              />
            </div>

            <div class="form-group">
              <input
                type="text"
                id="idea-viewer"
                class="form-control app-input"
                placeholder="Enter your name"
                maxlength="20"
                required
              />
            </div>

            <button type="submit" class="btn btn-suggest btn-block">
              Suggest Idea
            </button>
            <button
              type="button"
              id="clear"
              class="btn btn-clear btn-block"
            >
              Clear
            </button>
          </form>
        </div>
        <div class="col-md-6">
          <div id="ideas">
            <!-- <div class="card bg-secondary my-3">
              <div class="card-body">
                <p class="lead">
                  Create a realtime app <strong>(Feathers.js)</strong>
                  <br />
                  <em>Submitted by John Doe</em>
                  <br />
                  <small>2:05:10</small>
                </p>
              </div>
            </div> -->
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/@feathersjs/client@5.0.51/dist/feathers.js"></script>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script src="./render_submit.js"></script>
  </body>
</html>
